name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Explicit least-privilege permission declaration (OpenSSF & GitHub Security Standard)
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test:
    name: Unit & Security Test Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Vitest Suite
        run: npm test

  build:
    name: Production Turbopack Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
    env:
      AUTH_SECRET: "31b74234667b3f689628cc2ab9bdece0d060ef1b5fd58d19b9ee87b9505fcda2"
      AUTH_CLIENT_ID: "ci-mock-client-id"
      AUTH_CLIENT_SECRET: "ci-mock-client-secret"
      TURNSTILE_SECRET_KEY: "1x0000000000000000000000000000000AA"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Production Bundle
        run: npm run build
