name: "Bug Report"
description: "Report reproducible bugs, edge anomalies, or unexpected behavior"
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue!
        > **Security Warning**: If this report involves a sensitive vulnerability (e.g. secret leakage, authentication bypass, or SSRF vulnerability), please **do not** submit it publicly. Instead, report it privately via [GitHub Security Advisories](https://github.com/AndrewWangDev/panic_design/security/advisories/new) or email `security@andrewwangdev.com`.

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of panic.design is experiencing this issue?
      options:
        - "Control Plane Dashboard / UI"
        - "Tokens API (/api/tokens/*)"
        - "Quota & OCC Concurrency Control"
        - "LGPA Spatial Simulation & Map"
        - "Workers AI (Llama 4 Scout AIOps)"
        - "Security & SSRF Guardrails"
        - "Data Plane Reverse Proxy (gateway.andrewwangdev.com)"
        - "Build / Tooling / Tests"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Provide a clear and concise description of what the bug is.
      placeholder: "When creating a chaos token with custom latency, the terminal reports..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can maintainers reproduce the issue?
      placeholder: |
        1. Navigate to '/dashboard'
        2. Set Target Host to '...'
        3. Click 'Issue Edge Token'
        4. Observe error in terminal...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
      placeholder: "The gateway should correctly inject the specified 150ms delay and forward upstream headers..."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs & Terminal Output
      description: Paste any curl outputs, browser console errors, or server log snippets (ensure all sensitive tokens are redacted).
      render: shell

  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: Provide runtime environment details.
      placeholder: "Node.js v20.18.0, Wrangler v4.95.0, Windows 11 / macOS 15, Chrome 128"
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission Checklist
      options:
        - label: "I have searched existing issues to ensure this is not a duplicate."
          required: true
        - label: "I have verified that no sensitive credentials, private keys, or internal tokens are included in this report."
          required: true
